name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "18"
  PYTHON_VERSION: "3.11"
  WEB_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/carbonwise-web
  ML_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/carbonwise-ml

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -path './ml-service' -prune -o \
            -name '*.js' -print | while read -r file; do
              node --check "$file"
            done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Python dependencies
        run: pip install -r ml-service/requirements.txt

      - name: Compile Python sources
        run: python -m compileall ml-service

      - name: Smoke test backend API
        run: |
          PORT=3100 node server.js > /tmp/carbonwise-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend health check did not become ready"
              cat /tmp/carbonwise-web.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3100/api/health

      - name: Smoke test ML service
        run: |
          cd ml-service
          python app.py > /tmp/carbonwise-ml.log 2>&1 &
          ML_PID=$!
          trap 'kill $ML_PID' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ML service health check did not become ready"
              cat /tmp/carbonwise-ml.log
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:5001/health
          curl -fsS -X POST http://127.0.0.1:5001/classify \
            -H 'Content-Type: application/json' \
            -d '{"transport_pct":45.2,"electricity_pct":20.1,"food_pct":25.3,"waste_pct":9.4}'
          curl -fsS -X POST http://127.0.0.1:5001/predict \
            -H 'Content-Type: application/json' \
            -d '{"transport_pct":45.2,"electricity_pct":20.1,"food_pct":25.3,"waste_pct":9.4,"transport_freq":15,"electricity_freq":10,"food_freq":20,"waste_freq":5,"total_activities":50}'
          curl -fsS -X POST http://127.0.0.1:5001/anomaly \
            -H 'Content-Type: application/json' \
            -d '{"transport_pct":45.2,"electricity_pct":20.1,"food_pct":25.3,"waste_pct":9.4,"transport_freq":15,"electricity_freq":10,"food_freq":20,"waste_freq":5,"total_activities":50}'
          curl -fsS -X POST http://127.0.0.1:5001/recommend \
            -H 'Content-Type: application/json' \
            -d '{"transport_pct":45.2,"electricity_pct":20.1,"food_pct":25.3,"waste_pct":9.4}'

  publish-images:
    name: Build and publish container images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract web image metadata
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}

      - name: Extract ML image metadata
        id: ml_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ML_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push ML image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          tags: ${{ steps.ml_meta.outputs.tags }}
          labels: ${{ steps.ml_meta.outputs.labels }}